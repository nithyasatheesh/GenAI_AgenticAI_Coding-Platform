lab_id: 03-agent
title: "3 · Agent (LangGraph ReAct)"
mode_required: real
requires:
  - langgraph
  - langchain_core
notes: >
  REAL LangGraph agent. `create_react_agent` builds an actual state-graph that
  loops: model → tool → model → … until it answers. Uses the real tools from
  `get_tools()` and a real tool-calling LLM (OpenAI/Claude).

overview: |
  ## Problem

  Tool calling (Lab 2) was one round-trip. An **agent** runs the tool loop
  autonomously — it decides *which* tools to call and *how many times* until the
  goal is met.

  ## Approach — `langgraph.prebuilt.create_react_agent`

  | # | Step | Piece |
  |---|------|-------|
  | 1 | Build & run a ReAct agent | `create_react_agent(model, tools)` → `.invoke({"messages": [...]})` |
  | 2 | Give it a persona / rules | `prompt=` argument |
  | 3 | Watch it think | `agent.stream(..., stream_mode="values")` |
  | 4 | Inspect the graph | `agent.get_graph().draw_ascii()` |
  | 5 | Add your own tool | `@tool` + `create_react_agent(model, [*get_tools(), my_tool])` |

  ```
  goal ─▶ [ model ⇄ tools ]  loop until done ─▶ final answer + full trace
  ```

  ## Before you start
  Requires **OpenAI or Claude mode** (real tool-calling model).

tasks:
  - id: 1
    title: Build & run a ReAct agent
    prompt: |
      Create a ReAct agent from a real model + `get_tools()`, then `invoke` it
      with a question that needs **two** tools (a lookup and some arithmetic).
      Print every message in the returned trace.
    hints:
      - "`from langgraph.prebuilt import create_react_agent`"
      - "`agent = create_react_agent(get_chat_model(MODE), get_tools())`"
      - "`result = agent.invoke({'messages': [{'role': 'user', 'content': '...'}]})`"
      - "`for m in result['messages']: m.pretty_print()`"
    starter: |
      # Task 1 — a real LangGraph ReAct agent
      from langgraph.prebuilt import create_react_agent
      # TODO: agent = create_react_agent(get_chat_model(MODE), get_tools())
      q = "How many earned leave days do employees get, and what is that number times 3?"
      # TODO: result = agent.invoke({"messages": [{"role": "user", "content": q}]})
      # TODO: print each message in result["messages"]
    solution: |
      from langgraph.prebuilt import create_react_agent
      agent = create_react_agent(get_chat_model(MODE), get_tools())
      q = "How many earned leave days do employees get, and what is that number times 3?"
      result = agent.invoke({"messages": [{"role": "user", "content": q}]})
      for m in result["messages"]:
          m.pretty_print()
    checks:
      - {id: import, points: 3, pattern: "from\\s+langgraph\\.prebuilt\\s+import\\s+create_react_agent", desc: "imports create_react_agent"}
      - {id: build,  points: 4, pattern: "create_react_agent\\s*\\(\\s*get_chat_model\\s*\\(\\s*MODE\\s*\\)\\s*,\\s*get_tools", desc: "builds the agent with model + tools"}
      - {id: invoke, points: 3, pattern: "\\.invoke\\s*\\(\\s*\\{[^}]*messages", desc: "invokes with a messages dict"}

  - id: 2
    title: Give the agent a persona
    prompt: |
      Rebuild the agent with a `prompt=` system instruction — e.g. *"You are a
      terse HR assistant. Always cite the number you looked up."* Run the same
      question and compare.
    hints:
      - "`create_react_agent(model, tools, prompt='You are ...')`"
      - "The prompt becomes the system message prepended to every turn."
    starter: |
      # Task 2 — persona (reuses the pattern from Task 1)
      from langgraph.prebuilt import create_react_agent
      SYSTEM = "You are a terse HR assistant. Always state the exact number you looked up."
      # TODO: agent = create_react_agent(get_chat_model(MODE), get_tools(), prompt=SYSTEM)
      q = "How many earned leave days do employees get, and what is that number times 3?"
      # TODO: invoke and print the final message
    solution: |
      from langgraph.prebuilt import create_react_agent
      SYSTEM = "You are a terse HR assistant. Always state the exact number you looked up."
      agent = create_react_agent(get_chat_model(MODE), get_tools(), prompt=SYSTEM)
      q = "How many earned leave days do employees get, and what is that number times 3?"
      result = agent.invoke({"messages": [{"role": "user", "content": q}]})
      print(result["messages"][-1].content)
    checks:
      - {id: prompt, points: 6, pattern: "create_react_agent\\s*\\([\\s\\S]*prompt\\s*=", desc: "passes a system prompt"}
      - {id: run,    points: 4, pattern: "\\.invoke\\s*\\(", desc: "runs the agent"}

  - id: 3
    title: Watch it think (stream)
    prompt: |
      Stream the agent so you see each step as it happens. Print the last message
      of every streamed state.
    hints:
      - "`for step in agent.stream({'messages': [...]}, stream_mode='values'):`"
      - "`step['messages'][-1].pretty_print()`"
    starter: |
      # Task 3 — stream the ReAct loop
      from langgraph.prebuilt import create_react_agent
      agent = create_react_agent(get_chat_model(MODE), get_tools())
      q = "What is 4321 divided by 7, rounded? Then look up the sick leave allowance."
      # TODO: for step in agent.stream({"messages": [{"role":"user","content": q}]}, stream_mode="values"):
      # TODO:     print the last message
    solution: |
      from langgraph.prebuilt import create_react_agent
      agent = create_react_agent(get_chat_model(MODE), get_tools())
      q = "What is 4321 divided by 7, rounded? Then look up the sick leave allowance."
      for step in agent.stream({"messages": [{"role": "user", "content": q}]},
                               stream_mode="values"):
          step["messages"][-1].pretty_print()
    checks:
      - {id: stream, points: 6, pattern: "\\.stream\\s*\\(", desc: "uses agent.stream(...)"}
      - {id: mode,   points: 4, pattern: "stream_mode\\s*=\\s*[\"']values[\"']", desc: "stream_mode='values'"}

  - id: 4
    title: Inspect the graph
    prompt: |
      Print the agent's graph as ASCII so you can see the `agent` and `tools`
      nodes and the conditional edge between them.
    hints:
      - "`agent.get_graph()` returns the compiled graph."
      - "`.draw_ascii()` renders it; `.nodes` / `.edges` list the structure."
    starter: |
      # Task 4 — see the state graph
      from langgraph.prebuilt import create_react_agent
      agent = create_react_agent(get_chat_model(MODE), get_tools())
      # TODO: print(agent.get_graph().draw_ascii())
      # TODO: print(list(agent.get_graph().nodes))
    solution: |
      from langgraph.prebuilt import create_react_agent
      agent = create_react_agent(get_chat_model(MODE), get_tools())
      g = agent.get_graph()
      print(g.draw_ascii())
      print("nodes:", list(g.nodes))
    checks:
      - {id: graph, points: 6, pattern: "get_graph\\s*\\(\\s*\\)", desc: "calls agent.get_graph()"}
      - {id: draw,  points: 4, pattern: "draw_ascii|\\.nodes", desc: "renders / lists the graph"}

  - id: 5
    title: Add your own tool
    prompt: |
      Define a new `@tool` (e.g. `days_to_hours(days: int) -> int`) and give the
      agent `[*get_tools(), your_tool]`. Ask a question that forces it to use
      your tool after a lookup.
    hints:
      - "`from langchain_core.tools import tool`"
      - "`@tool` then a typed function with a one-line docstring."
      - "`create_react_agent(model, [*get_tools(), days_to_hours])`"
    starter: |
      # Task 5 — custom tool
      from langchain_core.tools import tool
      from langgraph.prebuilt import create_react_agent

      @tool
      def days_to_hours(days: int) -> int:
          """Convert a number of working days to hours (8h per day)."""
          return days * 8

      # TODO: agent = create_react_agent(get_chat_model(MODE), [*get_tools(), days_to_hours])
      q = "How many casual leave days are there, and how many working hours is that?"
      # TODO: invoke and print the final answer
    solution: |
      from langchain_core.tools import tool
      from langgraph.prebuilt import create_react_agent

      @tool
      def days_to_hours(days: int) -> int:
          """Convert a number of working days to hours (8h per day)."""
          return days * 8

      agent = create_react_agent(get_chat_model(MODE), [*get_tools(), days_to_hours])
      q = "How many casual leave days are there, and how many working hours is that?"
      result = agent.invoke({"messages": [{"role": "user", "content": q}]})
      print(result["messages"][-1].content)
    checks:
      - {id: tool,  points: 4, pattern: "@tool[\\s\\S]*def\\s+\\w+\\s*\\(", desc: "defines a custom @tool"}
      - {id: add,   points: 4, pattern: "\\[\\s*\\*get_tools\\s*\\(\\s*\\)\\s*,", desc: "adds it alongside get_tools()"}
      - {id: run,   points: 2, pattern: "\\.invoke\\s*\\(", desc: "runs the agent"}
