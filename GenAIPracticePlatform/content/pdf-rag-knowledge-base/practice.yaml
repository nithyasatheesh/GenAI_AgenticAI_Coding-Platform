# Drives tools/practice_app.py - an interactive "type the code, get hints, reveal
# the solution, check your work" practice UI for this lab.
# Each task: prompt (markdown) + progressive hints + starter code + solution code
# + rubric checks (regex over the learner's code -> points).

lab_id: pdf-rag-knowledge-base
title: PDF Knowledge Base RAG - Practice
run_cwd: 02_STARTER_CODE          # relative paths in code resolve from here
notes: >
  "Run" executes your code top-to-bottom in a fresh namespace and needs the VM's
  packages + OPENAI_API_KEY. "Check" and "Reveal solution" work fully offline.

tasks:
  - id: 1
    title: Load the PDF
    prompt: |
      Load `../04_DATA/sample_knowledge_base.pdf` with LangChain's PDF loader,
      then print the number of pages, the first page's text, and its metadata.
    hints:
      - "The loader lives in `langchain_community.document_loaders`."
      - "Its class name starts with `PyPDF...`."
      - "`.load()` returns a list of `Document` objects, one per page."
    starter: |
      # Task 1 - load and inspect the PDF
      # TODO: import the loader
      pdf_path = "../04_DATA/sample_knowledge_base.pdf"
      # TODO: loader = ...
      # TODO: documents = ...
      # TODO: print len(documents), documents[0].page_content, documents[0].metadata
    solution: |
      from langchain_community.document_loaders import PyPDFLoader

      pdf_path = "../04_DATA/sample_knowledge_base.pdf"
      loader = PyPDFLoader(pdf_path)
      documents = loader.load()

      print("Number of pages:", len(documents))
      print(documents[0].page_content[:800])
      print(documents[0].metadata)
    checks:
      - {id: import,  points: 2, pattern: "PyPDFLoader",              desc: "imports PyPDFLoader"}
      - {id: create,  points: 3, pattern: "PyPDFLoader\\s*\\(",       desc: "creates the loader"}
      - {id: load,    points: 3, pattern: "\\.load\\s*\\(\\s*\\)",    desc: "calls .load()"}
      - {id: inspect, points: 2, pattern: "len\\s*\\(\\s*documents",  desc: "prints the page count"}

  - id: 2
    title: Chunk the document
    prompt: |
      Split `documents` into overlapping fixed-size chunks with
      **chunk_size = 1000** and **chunk_overlap = 200**, then print the number of
      chunks and the first two.
    hints:
      - "Import `RecursiveCharacterTextSplitter` from `langchain_text_splitters`."
      - "Pass `chunk_size=` and `chunk_overlap=` to its constructor."
      - "`splitter.split_documents(documents)` returns the chunk list."
    starter: |
      # Task 2 - chunk the document (1000 / 200)
      # TODO: import RecursiveCharacterTextSplitter
      chunk_size = 1000
      chunk_overlap = 200
      # TODO: splitter = ...
      # TODO: chunks = ...
      # TODO: print(len(chunks)); print(chunks[:2])
    solution: |
      from langchain_text_splitters import RecursiveCharacterTextSplitter

      chunk_size = 1000
      chunk_overlap = 200

      splitter = RecursiveCharacterTextSplitter(
          chunk_size=chunk_size,
          chunk_overlap=chunk_overlap,
      )
      chunks = splitter.split_documents(documents)

      print("Number of chunks:", len(chunks))
      for i, ch in enumerate(chunks[:2]):
          print(f"--- chunk {i + 1} ---")
          print(ch.page_content[:400])
          print(ch.metadata)
    checks:
      - {id: import,  points: 2, pattern: "import\\s+RecursiveCharacterTextSplitter",                desc: "imports the splitter"}
      - {id: build,   points: 4, pattern: "RecursiveCharacterTextSplitter\\s*\\([\\s\\S]*chunk_size", desc: "creates it with chunk_size"}
      - {id: overlap, points: 2, pattern: "chunk_overlap",                                            desc: "sets chunk_overlap"}
      - {id: split,   points: 2, pattern: "split_documents\\s*\\(\\s*documents",                      desc: "splits the documents"}

  - id: 3
    title: Embeddings + ChromaDB
    prompt: |
      Embed the chunks with **text-embedding-3-small** and store them in a
      **persistent Chroma** store at `../chroma_db` (collection `pdf_kb`). Then run
      a similarity search for a test query and print the top 3 results.
    hints:
      - "`OpenAIEmbeddings` is in `langchain_openai`; `Chroma` is in `langchain_chroma`."
      - "`Chroma.from_documents(documents=..., embedding=..., persist_directory=..., collection_name=...)`."
      - "`vectorstore.similarity_search(query, k=3)`."
    starter: |
      # Task 3 - embeddings + persistent Chroma
      # TODO: import OpenAIEmbeddings and Chroma
      # TODO: embeddings = OpenAIEmbeddings(model=...)
      # TODO: vectorstore = Chroma.from_documents(..., persist_directory="../chroma_db",
      #                                           collection_name="pdf_kb")
      query = "How many casual leave days are provided each year?"
      # TODO: results = vectorstore.similarity_search(query, k=3); print them
    solution: |
      from langchain_openai import OpenAIEmbeddings
      from langchain_chroma import Chroma

      embeddings = OpenAIEmbeddings(model="text-embedding-3-small")

      vectorstore = Chroma.from_documents(
          documents=chunks,
          embedding=embeddings,
          persist_directory="../chroma_db",
          collection_name="pdf_kb",
      )

      query = "How many casual leave days are provided each year?"
      results = vectorstore.similarity_search(query, k=3)
      for i, doc in enumerate(results):
          print(f"--- result {i + 1} (page {doc.metadata.get('page', '?')}) ---")
          print(doc.page_content[:400])
    checks:
      - {id: embed_import, points: 2, pattern: "OpenAIEmbeddings",                        desc: "imports OpenAIEmbeddings"}
      - {id: embed_model,  points: 3, pattern: "text-embedding-3-small",                  desc: "uses text-embedding-3-small"}
      - {id: chroma,       points: 3, pattern: "Chroma\\.from_documents|Chroma\\s*\\(",   desc: "builds a Chroma store"}
      - {id: persist,      points: 2, pattern: "persist_directory",                       desc: "persists to disk"}
      - {id: search,       points: 2, pattern: "similarity_search\\s*\\([^)]*k\\s*=\\s*3", desc: "similarity_search(query, k=3)"}

  - id: 4
    title: Grounded RAG QA
    prompt: |
      Build a retriever (**k=3**) and **gpt-4o-mini** (**temperature=0**). Write a
      prompt that answers **only** from the retrieved context and, if the answer is
      missing, replies exactly:
      `I could not find the answer in the provided document.`
      Then answer a question and print the answer plus de-duplicated source pages.
    hints:
      - "`retriever = vectorstore.as_retriever(search_kwargs={\"k\": 3})`."
      - "`ChatOpenAI(model=\"gpt-4o-mini\", temperature=0)` and `ChatPromptTemplate.from_template(...)`."
      - "`context = \"\\n\\n\".join(d.page_content for d in docs)`; then `llm.invoke(prompt.format_messages(...))`."
    starter: |
      # Task 4 - grounded RAG QA
      # TODO: import ChatOpenAI, ChatPromptTemplate
      # TODO: retriever = vectorstore.as_retriever(search_kwargs={"k": 3})
      # TODO: llm = ChatOpenAI(model="gpt-4o-mini", temperature=0)
      # TODO: prompt = ChatPromptTemplate.from_template(""" ... {context} ... {question} ... """)
      question = "What is the standard notice period for regular full-time employees?"
      # TODO: docs = retriever.invoke(question); build context; invoke llm
      # TODO: print answer and sorted({d.metadata.get("page", "?") for d in docs})
    solution: |
      from langchain_openai import ChatOpenAI
      from langchain_core.prompts import ChatPromptTemplate

      retriever = vectorstore.as_retriever(search_kwargs={"k": 3})
      llm = ChatOpenAI(model="gpt-4o-mini", temperature=0)

      prompt = ChatPromptTemplate.from_template(
          """Answer the question using ONLY the context below. Do not use outside knowledge.
      If the answer is not in the context, reply exactly:
      "I could not find the answer in the provided document."

      Context:
      {context}

      Question:
      {question}

      Answer:"""
      )

      question = "What is the standard notice period for regular full-time employees?"
      docs = retriever.invoke(question)
      context = "\n\n".join(d.page_content for d in docs)
      response = llm.invoke(prompt.format_messages(context=context, question=question))

      print("Answer:", response.content)
      print("Pages:", sorted({d.metadata.get("page", "?") for d in docs}))
    checks:
      - {id: retriever,  points: 3, pattern: "as_retriever\\s*\\(",                          desc: "creates a retriever"}
      - {id: k3,         points: 2, pattern: "[\"']?k[\"']?\\s*[:=]\\s*3",                    desc: "k = 3"}
      - {id: model,      points: 3, pattern: "gpt-4o-mini",                                   desc: "uses gpt-4o-mini"}
      - {id: temp,       points: 2, pattern: "temperature\\s*=\\s*0",                         desc: "temperature = 0"}
      - {id: grounding,  points: 3, pattern: "could not find the answer in the provided document", desc: "exact refusal instruction in the prompt"}
      - {id: invoke,     points: 2, pattern: "llm\\.invoke|chain\\.invoke",                   desc: "invokes the model"}

  - id: 5
    title: Interactive application
    prompt: |
      Combine everything into an interactive loop: read a question, print a
      grounded answer + source pages, and stop on `exit`. (In the real lab this is
      `rag_app.py`; here, write the loop body.)
    hints:
      - "Wrap Task 4's answer logic in `def answer(question): ...`."
      - "`while True:` -> `q = input(...)` -> `if q.lower() == 'exit': break`."
      - "Reuse `retriever`, `llm`, `prompt` from Task 4 - don't rebuild them each turn."
    starter: |
      # Task 5 - interactive loop
      def answer(question):
          # TODO: retrieve, build context, invoke llm, return (text, pages)
          ...

      # TODO: write a `while True:` loop that reads a question with input(),
      #       prints answer(question), and stops when the user types "exit".
    solution: |
      def answer(question):
          docs = retriever.invoke(question)
          context = "\n\n".join(d.page_content for d in docs)
          resp = llm.invoke(prompt.format_messages(context=context, question=question))
          pages = sorted({d.metadata.get("page", "?") for d in docs})
          return resp.content.strip(), pages

      while True:
          q = input("Question> ").strip()
          if not q:
              continue
          if q.lower() == "exit":
              break
          text, pages = answer(q)
          print("Answer:", text)
          print("Pages:", pages)
    checks:
      - {id: func,   points: 3, pattern: "def\\s+answer\\s*\\([\\s\\S]*return",  desc: "answer() that returns a result"}
      - {id: loop,   points: 3, pattern: "while\\s+True",                        desc: "interactive while loop"}
      - {id: exit,   points: 2, pattern: "==\\s*[\"']exit[\"']|lower\\(\\)\\s*==", desc: "stops on 'exit'"}
      - {id: reuse,  points: 2, pattern: "retriever\\.invoke|retriever\\.get_relevant", desc: "reuses the retriever"}
