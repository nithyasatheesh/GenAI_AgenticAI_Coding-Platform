      from langchain_mcp_adapters.client import MultiServerMCPClient

      async def main():
          client = MultiServerMCPClient(mcp_stdio_config())
          tools = await client.get_tools()
          by_name = {t.name: t for t in tools}
          # TODO: out = await by_name["multiply"].ainvoke({"a": 6, "b": 7})
          # TODO: print(out)

      asyncio.run(main())
    solution: |
      import asyncio
      from langchain_mcp_adapters.client import MultiServerMCPClient

      async def main():
          client = MultiServerMCPClient(mcp_stdio_config())
          by_name = {t.name: t for t in await client.get_tools()}
          out = await by_name["multiply"].ainvoke({"a": 6, "b": 7})
          print("multiply(6, 7) =", out)
          print("leave_allowance('earned') =",
                await by_name["leave_allowance"].ainvoke({"kind": "earned"}))

      asyncio.run(main())
    checks:
      - {id: pick,   points: 4, pattern: "by_name\\s*=\\s*\\{|\\[\\s*[\"']multiply", desc: "selects the multiply tool"}
      - {id: invoke, points: 6, pattern: "\\.ainvoke\\s*\\(\\s*\\{", desc: "awaits .ainvoke({...})"}

