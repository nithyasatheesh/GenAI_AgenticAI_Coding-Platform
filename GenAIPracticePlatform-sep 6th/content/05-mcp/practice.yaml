lab_id: 05-mcp
title: "5 · MCP (Model Context Protocol)"
requires:
  - mcp
  - langchain_mcp_adapters
  - langchain_core
notes: >
  REAL MCP. Needs the `mcp` + `langchain-mcp-adapters` packages —
  `pip install -r requirements-full.txt` (they are NOT in the default deploy set).
  The bundled `mcp_server.py` is launched as a real subprocess and
  `langchain-mcp-adapters` speaks the Model Context Protocol over stdio.
  Tasks 1-3 need no API key; Tasks 4-5 add a real LLM.

overview: |
  ## Problem

  MCP is a standard way for an app (the *host*) to connect to external tool
  *servers* over JSON-RPC. Same tools, any client. Here you connect to a real
  local MCP server and use its tools from LangChain.

  ## Approach

  | # | Step | Piece |
  |---|------|-------|
  | 1 | Connect + discover | `MultiServerMCPClient(mcp_stdio_config())` → `await client.get_tools()` |
  | 2 | Call an MCP tool | `await add.ainvoke({"a": 2, "b": 3})` |
  | 3 | Read an MCP resource | `await client.get_resources("sandbox")` |
  | 4 | MCP tools + a model | `llm.bind_tools(mcp_tools)` — one round-trip |
  | 5 | Agent over MCP | `create_react_agent(llm, mcp_tools)` |

  ```
  your code ─▶ MultiServerMCPClient ──stdio/JSON-RPC──▶ mcp_server.py (FastMCP)
                     │                                        ├─ add, multiply
                     └─ get_tools() → LangChain tools         └─ leave_allowance
  ```

  The server (`mcp_server.py`) exposes `add`, `multiply`, `leave_allowance`, and
  a resource `policy://notice-period`.

  ## Before you start
  - Install `requirements-full.txt` (adds `mcp`, `langchain-mcp-adapters`). On the
    default Streamlit-Cloud deploy these aren't present and Run is blocked with a
    message — run this lab locally or in Docker.
  - Tasks 1-3: no key. Tasks 4-5: **OpenAI or Claude mode**.

tasks:
  - id: 1
    title: Connect & discover
    prompt: |
      Start the MCP client against the bundled server and print the **name** of
      every tool it exposes.
    hints:
      - "`from langchain_mcp_adapters.client import MultiServerMCPClient`"
      - "`client = MultiServerMCPClient(mcp_stdio_config())` — `mcp_stdio_config()` is provided."
      - "`get_tools()` is async: wrap it in `async def` and `asyncio.run(...)`."
    starter: |
      # Task 1 — connect to the real MCP server
      import asyncio

      async def main():
          # TODO: from langchain_mcp_adapters.client import MultiServerMCPClient
          # TODO: client = MultiServerMCPClient(mcp_stdio_config())
          # TODO: tools = await client.get_tools()
          # TODO: print name / description / .args for each tool
          ...

      asyncio.run(main())
    solution: |
      import asyncio
      from langchain_mcp_adapters.client import MultiServerMCPClient

      async def main():
          client = MultiServerMCPClient(mcp_stdio_config())
          tools = await client.get_tools()
          for t in tools:
              print(f"{t.name}: {t.description}  args={t.args}")

      asyncio.run(main())
    checks:
      - {id: import, points: 3, pattern: "from\\s+langchain_mcp_adapters\\.client\\s+import\\s+MultiServerMCPClient", desc: "imports MultiServerMCPClient"}
      - {id: cfg,    points: 3, pattern: "MultiServerMCPClient\\s*\\(\\s*mcp_stdio_config\\s*\\(\\s*\\)", desc: "uses mcp_stdio_config()"}
      - {id: tools,  points: 4, pattern: "await\\s+client\\.get_tools\\s*\\(\\s*\\)", desc: "awaits client.get_tools()"}

