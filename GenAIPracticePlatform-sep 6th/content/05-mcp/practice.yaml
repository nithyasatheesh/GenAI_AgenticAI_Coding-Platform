      asyncio.run(main())
    solution: |
      import asyncio
      from langgraph.prebuilt import create_react_agent
      from langchain_mcp_adapters.client import MultiServerMCPClient

      async def main():
          client = MultiServerMCPClient(mcp_stdio_config())
          tools = await client.get_tools()
          agent = create_react_agent(get_chat_model(MODE), tools)
          q = "What is 8 times 9, and how many sick leave days do we get?"
          result = await agent.ainvoke({"messages": [{"role": "user", "content": q}]})
          for m in result["messages"]:
              m.pretty_print()

      asyncio.run(main())
    checks:
      - {id: agent,  points: 5, pattern: "create_react_agent\\s*\\(\\s*get_chat_model\\s*\\(\\s*MODE\\s*\\)\\s*,\\s*tools", desc: "agent over the MCP tools"}
      - {id: ainv,   points: 5, pattern: "await\\s+agent\\.ainvoke", desc: "awaits agent.ainvoke(...)"}
