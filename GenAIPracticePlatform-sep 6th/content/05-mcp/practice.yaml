  - id: 4
    title: MCP tools + a model
    prompt: |
      Bind the MCP tools to a real model and ask *"What is 19 times 21?"* — the
      model should call the MCP `multiply` tool. Run one manual round-trip.
      **(OpenAI/Claude mode.)**
    needs_real: true
    hints:
      - "`llm = get_chat_model(MODE).bind_tools(mcp_tools)`"
      - "`resp = await llm.ainvoke('What is 19 times 21?')` → `resp.tool_calls`"
      - "Run the tool with `await by_name[tc['name']].ainvoke(tc['args'])`, wrap in `ToolMessage`, re-invoke."
    starter: |
      # Task 4 — model + MCP tools
      import asyncio
      from langchain_core.messages import HumanMessage, ToolMessage
      from langchain_mcp_adapters.client import MultiServerMCPClient

      async def main():
          client = MultiServerMCPClient(mcp_stdio_config())
          tools = await client.get_tools()
          by_name = {t.name: t for t in tools}
          llm = get_chat_model(MODE).bind_tools(tools)
          q = "What is 19 times 21?"
          # TODO: resp = await llm.ainvoke([HumanMessage(q)])  ; print(resp.tool_calls)
          # TODO: run each tool call (await .ainvoke), build ToolMessage, re-invoke, print answer

      asyncio.run(main())
    solution: |
      import asyncio
      from langchain_core.messages import HumanMessage, ToolMessage
      from langchain_mcp_adapters.client import MultiServerMCPClient

      async def main():
          client = MultiServerMCPClient(mcp_stdio_config())
          tools = await client.get_tools()
          by_name = {t.name: t for t in tools}
          llm = get_chat_model(MODE).bind_tools(tools)
          q = "What is 19 times 21?"
          resp = await llm.ainvoke([HumanMessage(q)])
          print("tool_calls:", resp.tool_calls)
          msgs = [HumanMessage(q), resp]
          for tc in resp.tool_calls:
              out = await by_name[tc["name"]].ainvoke(tc["args"])
              msgs.append(ToolMessage(content=str(out), tool_call_id=tc["id"]))
          print("ANSWER:", (await llm.ainvoke(msgs)).content)

      asyncio.run(main())
    checks:
      - {id: bind,   points: 4, pattern: "bind_tools\\s*\\(\\s*tools", desc: "binds the MCP tools"}
      - {id: ainv,   points: 3, pattern: "await\\s+llm\\.ainvoke", desc: "awaits llm.ainvoke"}
      - {id: back,   points: 3, pattern: "ToolMessage\\s*\\(", desc: "feeds the MCP result back"}

  - id: 5
